<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1018"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D5FF"/>
      <stop offset="50%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#7257FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="16 12" opacity="0.3"/>
  
  <!-- Monogram IT -->
  <g filter="url(#glow)">
    <!-- Letter I -->
    <path d="M160 160 H230 V352 H160" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M195 160 V352" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Letter T -->
    <path d="M260 160 H370" stroke="#F5F7FA" stroke-width="28" stroke-linecap="round"/>
    <path d="M315 160 V352" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle code dot -->
  <circle cx="370" cy="352" r="12" fill="#00D5FF"/>
</svg>
